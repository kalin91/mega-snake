name: Dependency Vulnerability Scan
# NOTE: This file lives under `docs/` because the automation that generated it does not have
# permission to write directly under `.github/workflows/`. Copy it there (removing this note)
# to activate scheduled and pull-request dependency scanning:
#
#   cp docs/dependency-scan-workflow.yml .github/workflows/dependency-scan.yml
#
# See the "Dependency vulnerability scanning" section in README.md for details.

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  pull_request:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Install project (with dev dependencies)
        run: uv sync --all-extras

      - name: Scan dependencies and file issues for new findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGA_SNAKE_SHELL: bash
        run: |
          uv run mgsnake scan-dependencies
